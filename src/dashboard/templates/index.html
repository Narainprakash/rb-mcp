<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hermes Trading Agent Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar glass">
            <div class="logo">
                <h2>Hermes</h2>
                <span class="badge">Agentic</span>
            </div>
            
            <div class="status-card glass-card">
                <h3>System Status</h3>
                <div class="status-indicator">
                    <div id="system-dot" class="dot green"></div>
                    <span id="system-text">Active</span>
                </div>
            </div>

            <div class="status-card glass-card">
                <h3>X API Quota</h3>
                <div class="progress-bar-container">
                    <div id="quota-bar" class="progress-bar"></div>
                </div>
                <div class="quota-text">
                    <span id="quota-used">0</span> / <span id="quota-limit">10k</span>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header>
                <h1>Live Dashboard</h1>
                <p>Read-only view of agentic trading activity.</p>
            </header>

            <div class="grid-container">
                <!-- Open Positions -->
                <section class="panel glass-card">
                    <h2>Open Positions</h2>
                    <div class="table-container">
                        <table id="positions-table">
                            <thead>
                                <tr>
                                    <th>Contract</th>
                                    <th>Qty</th>
                                    <th>Avg Cost</th>
                                    <th>Limit Target</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- JS injected -->
                            </tbody>
                        </table>
                    </div>
                </section>

                <!-- Realized History -->
                <section class="panel glass-card">
                    <h2>Recent Realized P/L</h2>
                    <div class="table-container">
                        <table id="history-table">
                            <thead>
                                <tr>
                                    <th>Contract</th>
                                    <th>Qty</th>
                                    <th>Fill Time</th>
                                    <th>P/L ($)</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- JS injected -->
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>

            <!-- Live Feed -->
            <section class="panel glass-card full-width">
                <h2>Activity Feed</h2>
                <div class="feed-container" id="activity-feed">
                    <!-- JS injected -->
                </div>
            </section>
        </main>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
